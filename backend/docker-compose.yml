services:
  postgres:
    image: postgres:16-alpine
    container_name: nepse-insight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nepse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nepse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nepse_insight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nepse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nepse} -d ${POSTGRES_DB:-nepse_insight}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nepse_pgdata:
